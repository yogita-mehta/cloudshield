global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cloudshield-backends"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["172.28.0.11:8000", "172.28.0.12:8000"]
        labels:
          role: "upstream-application"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["172.28.0.21:9100"]
        labels:
          role: "system-metrics"

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["172.28.0.22:9113"]
        labels:
          role: "ingress-proxy"
