upstream cloudshield_backend {
    # Active upstream application server pool (static IPs for deterministic routing)
    server 172.28.0.11:8000 max_fails=3 fail_timeout=5s;
    server 172.28.0.12:8000 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name localhost;

    # Tier 2: Automated Dynamic IP Deny Include
    include /etc/nginx/conf.d/blocklist.conf;

    # Tier 1: Connection & Rate Limiting Enforcement
    limit_req zone=flood_limit burst=40 nodelay;
    limit_conn conn_limit 30;

    # Nginx self health check endpoint
    location /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"cloudshield-nginx-proxy"}';
    }

    # Nginx stub_status for Prometheus nginx-exporter
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.28.0.0/16;
        deny all;
    }

    # Phase 5: Honeypot Decoys & Robots.txt
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /admin-backup/\nDisallow: /wp-login.php\nDisallow: /hidden-admin.html\n";
    }

    # Proxy all traffic to the upstream backend pool
    location / {
        proxy_pass http://cloudshield_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Simulation-Token $http_x_simulation_token;
        proxy_set_header X-Simulated-IP $http_x_simulated_ip;
        
        # Identification header so clients see which upstream node answered
        add_header X-Served-By $upstream_addr always;
        add_header X-Proxy-Engine "CloudShield-Nginx" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
