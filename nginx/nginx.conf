user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tier 1 Mitigation: Rate Limiting & Connection Limiting Zones
    limit_req_zone $binary_remote_addr zone=flood_limit:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Structured JSON log format for entropy analysis and telemetry engine
    log_format json_analytics escape=json
      '{"time_local":"$time_iso8601",'
      '"msec":"$msec",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$remote_addr",'
      '"sim_token":"$http_x_simulation_token",'
      '"sim_ip":"$http_x_simulated_ip",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  json_analytics;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
