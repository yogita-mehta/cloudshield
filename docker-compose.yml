services:
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudshield-backend-1
    environment:
      - SERVER_NAME=backend-1
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/data/cloudshield.db
      - SIMULATION_TOKEN=${SIMULATION_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./nginx/conf.d:/app/nginx_conf
      - ./backend/app:/app/app
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudshield-backend-2
    environment:
      - SERVER_NAME=backend-2
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/data/cloudshield.db
      - SIMULATION_TOKEN=${SIMULATION_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./nginx/conf.d:/app/nginx_conf
      - ./backend/app:/app/app
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cloudshield-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./data/logs:/var/log/nginx
    depends_on:
      - backend-1
      - backend-2
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudshield-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: cloudshield-node-exporter
    ports:
      - "9100:9100"
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.21
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: cloudshield-nginx-exporter
    command:
      - -nginx.scrape-uri=http://172.28.0.10:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.22
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudshield-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - nginx
    networks:
      cloudshield-net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

networks:
  cloudshield-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
